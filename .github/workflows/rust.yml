name: Rust

on:
  push:
    branches: [ "nightly" ]
  pull_request:
    branches: [ "nightly" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    # The compiler is the one rust-toolchain.toml names; rustup installs it on first use.
    - name: Toolchain
      run: rustup toolchain install
    - name: Build
      run: cargo build --verbose
    - name: Run tests
      run: cargo test --verbose
